version: '3.8'

services:
  # =========================================================================
  # 1. SQL SERVER 2022 (Database-per-Service Storage)
  # =========================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexpay-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-Password123!}
      - MSSQL_PID=Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Password123!}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - nexpay-network

  # Tự động chạy script khởi tạo Database (IdentityDb, WalletDb, PaymentDb) khi SQL Server sẵn sàng
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexpay-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./docker/sqlserver/init-databases.sql:/init-databases.sql
    entrypoint: >
      bash -c "
      echo 'Running database initialization script...' &&
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P '${MSSQL_SA_PASSWORD:-Password123!}' -C -i /init-databases.sql &&
      echo 'Database initialization completed successfully!'"
    networks:
      - nexpay-network

  # =========================================================================
  # 2. RABBITMQ (Message Broker cho Event-Driven & Outbox / Saga)
  # =========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nexpay-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"       # AMQP protocol
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # Management Web UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexpay-network

  # =========================================================================
  # 3. REDIS (Distributed Lock, Idempotency Cache & Fast Balance Lookup)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: nexpay-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexpay-network

  # =========================================================================
  # 4. SEQ (Tập trung Logs & Distributed Tracing cho toàn bộ Microservices)
  # =========================================================================
  seq:
    image: datalust/seq:latest
    container_name: nexpay-seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "${SEQ_PORT:-5341}:80" # Web UI (http://localhost:5341)
    volumes:
      - seq_data:/data
    networks:
      - nexpay-network

volumes:
  sqlserver_data:
  rabbitmq_data:
  redis_data:
  seq_data:

networks:
  nexpay-network:
    driver: bridge

